# Strict four-way Search-R1 overlay. Runtime paths and workload size are frozen
# by comparison/run_nemo_search_r1.sh.
defaults: grpo_qwen2_5_7b_search_r1_observed.yaml

data:
  # The four frameworks consume the same deterministic source order. The
  # paper-reproduction recipe retains its native shuffle setting separately.
  shuffle: false

policy:
  generation:
    # The original Search-R1 validation path sets do_sample=False. Keep every
    # framework's held-out predictions greedy and single-sample.
    val_temperature: 0.0
    val_top_p: 1.0

logger:
  swanlab:
    project: search-r1-four-way
    name: nemo-search-r1-four-way
